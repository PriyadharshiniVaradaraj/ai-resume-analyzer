<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AI Resume Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>

<body>
    <a href="{{ url_for('auth.admin_login') }}" class="admin-link">Admin Login</a>
    <div class="auth-card">
        <h1>Welcome back</h1>
        <p class="subtitle">Log in to analyze your resume</p>

        {% for message in get_flashed_messages() %}
        <div class="flash">{{ message }}</div>
        {% endfor %}

        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required autofocus>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
                <button type="button" class="toggle-pw" onclick="togglePw()">Show</button>
            </div>

            <button type="submit" class="btn">Login</button>
        </form>

        <p class="switch">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
    </div>

    <script>
        function togglePw() {
            var pw = document.getElementById("password");
            var btn = document.querySelector(".toggle-pw");
            if (pw.type === "password") { pw.type = "text"; btn.textContent = "Hide"; }
            else { pw.type = "password"; btn.textContent = "Show"; }
        }
    </script>
</body>

</html>
